<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ホッケーバトル</title>
<meta name="theme-color" content="#0b1b3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ホッケー">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-2.png">
<link rel="apple-touch-icon" href="icon-192-2.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#0b1b3a;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none; touch-action:none;
  }
  #g {
    position:fixed; inset:0; width:100%; height:100%;
    display:block; touch-action:none;
  }
</style>

<canvas id="g"></canvas>

<script>
(function () {
  'use strict';

  // 更新したら必ずここと sw.js の CACHE を上げる
  var APP_VERSION = '2.10.0';

  var cvs = document.getElementById('g');
  var ctx = cvs.getContext('2d');

  var W = 0, H = 0;            // 画面サイズ (CSSピクセル)
  var WIN_SCORE = 5;

  // ---------------------------------------------------------------- 画像
  var imgs = {};
  function loadImg(key, src) {
    var i = new Image();
    i.onload = function () { imgs[key] = i; };
    i.src = src;
  }
  loadImg('ttlStage','ttl-stage.png');
  loadImg('bg',      'title-bg.jpg');
  loadImg('side',    'side.jpg');
  loadImg('jk0',     'jk-0.png');
  loadImg('jk1',     'jk-1.png');
  loadImg('jk2',     'jk-2.png');
  loadImg('start',   'btn-start.png');
  loadImg('solo',    'btn-solo.png');
  loadImg('duo',     'btn-duo.png');
  loadImg('goal',    'goal.png');
  loadImg('num1',    'num-1.png');
  loadImg('num2',    'num-2.png');
  loadImg('num3',    'num-3.png');
  loadImg('malletR', 'mallet-red.png');
  loadImg('malletB', 'mallet-blue.png');
  loadImg('puck',    'puck.png');

  // ---------------------------------------------------------------- 音楽
  var tracks = {};
  var curTrack = null;

  function playBgm(key, src, vol) {
    if (curTrack === key) {
      var cur = tracks[key];
      if (cur && cur.paused) {
        cur.volume = vol;
        var q0 = cur.play();
        if (q0 && q0.catch) q0.catch(function () {});
      }
      return;
    }
    fadeOutBgm();
    if (!tracks[key]) {
      var a = new Audio(src);
      a.loop = true;
      tracks[key] = a;
    }
    tracks[key].volume = vol;
    curTrack = key;
    var q = tracks[key].play();
    if (q && q.catch) q.catch(function () {});   // 自動再生が止められても気にしない
  }

  function fadeOutBgm() {
    var key = curTrack;
    if (!key) return;
    curTrack = null;
    var a = tracks[key];
    if (!a || a.paused) return;
    var v = a.volume;
    var id = setInterval(function () {           // ふわっと止める
      v -= 0.06;
      if (v <= 0) { clearInterval(id); a.pause(); a.currentTime = 0; }
      else a.volume = v;
    }, 40);
  }

  function titleBgm()  { playBgm('title',  'title.mp3',  0.5); }
  function battleBgm() { playBgm('battle', 'battle.mp3', 0.4); }

  // 各ステージの盤面と、その絵の中での氷の範囲・ゴールの幅・センターラインの位置
  // （すべて画像サイズに対する割合）
  var STAGES = [
    { key:'ice',    src:'field-3.jpg',
      fld:{ x0:0.0680, x1:0.9278, y0:0.0826, y1:0.9223, mid:0.4926, goal:0.1629, circle:0.093 } },
    { key:'forest', src:'stage-forest.jpg',
      fld:{ x0:0.0820, x1:0.9180, y0:0.0740, y1:0.9208, mid:0.4952, goal:0.1585, circle:0.093 } },
    { key:'water',  src:'stage-water.jpg',
      fld:{ x0:0.0820, x1:0.9180, y0:0.0740, y1:0.9208, mid:0.4952, goal:0.1585, circle:0.093 } },
    { key:'lava',   src:'stage-lava.jpg',
      fld:{ x0:0.0820, x1:0.9180, y0:0.0740, y1:0.9208, mid:0.4952, goal:0.1585, circle:0.093 } }
  ];
  var stageIdx = 0;
  var FLD = STAGES[0].fld;
  STAGES.forEach(function (st, i) { loadImg('stage' + i, st.src); });
  var F = { x:0, y:0, w:0, h:0, cx:0, cy:0 };   // 盤面（氷）の位置
  var IMG  = { x:0, y:0, w:0, h:0 };            // field-3.jpg を描く位置
  var TIMG = { x:0, y:0, w:0, h:0 };            // title-bg.jpg を描く位置
  // 盤面の縦横比はこの範囲に収める。横に広い画面（タブレットや折りたたみ）では
  // 引き伸ばさず中央に置き、まわりは背景でうめる
  var AR_MAX = 0.60, AR_MIN = 0.40;

  // ---------------------------------------------------------------- 見た目
  var COL = {
    p1:       '#2f7dff',   // 下のプレイヤー
    p1dark:   '#1b4ea8',
    p2:       '#ff4d6d',   // 上のプレイヤー
    p2dark:   '#b3253f',
    puck:     '#ff9f1c',
    puckDark: '#c26a00'
  };
  var SANS = 'px system-ui, -apple-system, "Hiragino Sans", sans-serif';
  var EMO  = 'px system-ui, -apple-system, "Apple Color Emoji", "Noto Color Emoji", sans-serif';

  // ---------------------------------------------------------------- 状態
  var puck = { x:0, y:0, vx:0, vy:0, r:0 };
  var mallets = [
    // side 0 = 下(プレイヤー1) / side 1 = 上(プレイヤー2 またはコンピューター)
    // svx/svy = 見た目どおりの速さ（数フレームならした値）。当たりの強さはこれで決める
    { side:0, x:0, y:0, tx:0, ty:0, vx:0, vy:0, lx:0, ly:0, svx:0, svy:0,
      r:0, pid:null, hitCool:0, col:COL.p1, dark:COL.p1dark },
    { side:1, x:0, y:0, tx:0, ty:0, vx:0, vy:0, lx:0, ly:0, svx:0, svy:0,
      r:0, pid:null, hitCool:0, col:COL.p2, dark:COL.p2dark }
  ];

  var score      = [0, 0];
  var mode       = 'title';  // 'title' | 'select' | 'stage' | 'janken' | 'count' | 'play' | 'goal' | 'win'
  var modeTimer  = 0;
  var goalSide   = 0;        // 得点したプレイヤー
  var serveSide  = 0;        // パックを転がしてもらう側（点を入れられた方）
  var lastCount  = -1;
  var CD_STEP    = 0.8;      // カウント1つぶんの秒数
  var players    = 2;        // 1 = コンピューターと対戦
  var showHint   = true;
  var idleTime   = 0;        // パックがその場から動けていない時間
  var stuckT     = 0, stuckX = 0, stuckY = 0;
  var flash      = 0;
  var shake      = 0;
  var trail      = [];
  var parts      = [];       // タップの粒
  var pressIdx   = -1;       // 押されたボタン
  var pressT     = 0;

  var resetBtn   = { x:0, y:0, r:0 };
  var resetPid   = null;     // リセットは長押しでのみ発動（誤タップ防止）
  var resetHold  = 0;
  var homeBtn    = { x:0, y:0, r:0 };
  var homePid    = null;     // タイトルに戻るのも長押し
  var homeHold   = 0;
  var RESET_HOLD = 0.9;

  // じゃんけん（試合の最初だけ。勝った方がパックをもらえる）
  var JK_EMOJI = ['✊', '✌️', '✋'];   // グー / チョキ / パー
  var JK_BEATS = [1, 2, 0];                              // グー→チョキ→パー→グー
  var jkPhase  = 'pick';     // 'pick' | 'show'
  var jkChoice = [null, null];
  var jkWinner = -1;
  var JK_WAIT  = 8;          // 片方だけ選んで止まらないための待ち時間（秒）

  // コンピューター（4歳児が勝てるようにかなり弱くしている）
  var AI_SPEED = 0.95;       // 盤面の幅/秒（人のマレットは指の位置そのもの）
  var ai = { think:0, errX:0, rest:0, jkT:0 };

  // ---------------------------------------------------------------- 配置
  var prevW = 0, prevH = 0, prevX = 0, prevY = 0;

  // 画面の形に合わせて、絵を置く矩形を決める。
  // 縦長の画面はいっぱいに広げ、横に広い画面では中央に寄せて左右をあける
  function fitRect(rect, arMax, arMin) {
    var w = Math.min(W, H * arMax);
    var h = Math.min(H, w / arMin);
    rect.w = w; rect.h = h;
    rect.x = (W - w) / 2;
    rect.y = (H - h) / 2;
  }

  function layout() {
    fitRect(IMG, AR_MAX, AR_MIN);
    fitRect(TIMG, 0.72, 0.42);

    F.x = IMG.x + FLD.x0 * IMG.w;  F.w = (FLD.x1 - FLD.x0) * IMG.w;
    F.y = IMG.y + FLD.y0 * IMG.h;  F.h = (FLD.y1 - FLD.y0) * IMG.h;
    F.cx = F.x + F.w / 2;
    F.cy = IMG.y + FLD.mid * IMG.h;   // 絵に描かれたセンターラインに合わせる

    var s = Math.min(F.w, F.h * 0.62);           // 大きさの基準
    puck.r = s * 0.051;
    mallets[0].r = mallets[1].r = s * 0.081;

    var margin = F.x - IMG.x;                    // 盤の外枠の幅
    resetBtn.r = Math.min(margin * 0.42, s * 0.055);
    resetBtn.x = IMG.x + margin * 0.5;
    resetBtn.y = F.cy;
    homeBtn.r = resetBtn.r;                      // 右の枠に、タイトルへ戻るボタン
    homeBtn.x = IMG.x + IMG.w - margin * 0.5;
    homeBtn.y = F.cy;

    if (!prevW || !prevH) {
      placeAll();
    } else {
      // 画面サイズが変わってもプレー中の位置関係を保つ
      var sx = F.w / prevW, sy = F.h / prevH;
      puck.x = F.x + (puck.x - prevX) * sx;
      puck.y = F.y + (puck.y - prevY) * sy;
      puck.vx *= sx; puck.vy *= sy;
      puck.x = clamp(puck.x, F.x + puck.r, F.x + F.w - puck.r);
      puck.y = clamp(puck.y, F.y + puck.r, F.y + F.h - puck.r);
      for (var i = 0; i < 2; i++) {
        var m = mallets[i];
        m.x  = F.x + (m.x  - prevX) * sx;  m.y  = F.y + (m.y  - prevY) * sy;
        m.tx = F.x + (m.tx - prevX) * sx;  m.ty = F.y + (m.ty - prevY) * sy;
        clampTarget(m);
        m.x = clamp(m.x, F.x + m.r, F.x + F.w - m.r);
        m.y = clamp(m.y, F.y + m.r, F.y + F.h - m.r);
      }
    }
    prevW = F.w; prevH = F.h; prevX = F.x; prevY = F.y;
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function goalHalfWidth()  { return FLD.goal * IMG.w; }
  // 小さい画面の横持ちだけ、たてむきを案内する（タブレットはそのまま遊べる）
  function isLandscape()    { return W > H * 1.15 && H < 500; }

  function placeAll() {
    resetPuck();
    var m0 = mallets[0], m1 = mallets[1];
    m0.x = m0.tx = F.cx; m0.y = m0.ty = F.y + F.h * 0.80;
    m1.x = m1.tx = F.cx; m1.y = m1.ty = F.y + F.h * 0.20;
    m0.vx = m0.vy = m1.vx = m1.vy = 0;
    m0.svx = m0.svy = m1.svx = m1.svy = 0;
    m0.lx = m0.x; m0.ly = m0.y; m1.lx = m1.x; m1.ly = m1.y;
  }

  function resetPuck() {
    puck.x = F.cx; puck.y = F.cy;
    puck.vx = 0; puck.vy = 0;
    trail.length = 0;
    idleTime = 0;
    // 再開位置にマレットが居ると弾いてしまうので自陣側へ少し下げる
    for (var i = 0; i < 2; i++) {
      var m = mallets[i];
      var need = m.r + puck.r + Math.max(4, m.r * 0.15);
      if (dist2(m.x, m.y, puck.x, puck.y) < need * need) {
        m.y = m.ty = puck.y + (m.side === 0 ? need : -need);
        m.vx = m.vy = 0;
        clampTarget(m);
      }
    }
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = cvs.clientWidth;
    H = cvs.clientHeight;
    cvs.width  = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
  }

  // ---------------------------------------------------------------- 音
  var ac = null;
  function audio() {
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function beep(freq, dur, type, vol, delay) {
    var a = audio();
    if (!a) return;
    var t = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function sndHit(power)  { beep(320 + power * 260, 0.10, 'square', 0.04 + power * 0.12); }
  function sndWall(power) { beep(180, 0.07, 'triangle', 0.03 + power * 0.09); }
  function sndGoal()      { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.20, 'square', 0.15, i * 0.09); }); }
  function sndWin()       { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { beep(f, 0.26, 'square', 0.16, i * 0.13); }); }
  function sndStart()     { [523, 784, 1047].forEach(function (f, i) { beep(f, 0.17, 'square', 0.16, i * 0.07); }); }

  // 強く打ったときの「バシーン！」
  function sndSmash(power) {
    var a = audio();
    if (!a) return;
    var t = a.currentTime;
    var vol = 0.15 + power * 0.15;

    // ドン（低い衝撃）
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(240, t);
    o.frequency.exponentialRampToValueAtTime(55, t + 0.16);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.22);

    // パーン（はじける音）
    var len = Math.floor(a.sampleRate * 0.12);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    }
    var src = a.createBufferSource();
    src.buffer = buf;
    var bp = a.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(2700, t);
    bp.frequency.exponentialRampToValueAtTime(850, t + 0.10);
    bp.Q.value = 1.2;
    var ng = a.createGain();
    ng.gain.value = vol * 0.85;
    src.connect(bp); bp.connect(ng); ng.connect(a.destination);
    src.start(t); src.stop(t + 0.13);

    // キン（高く抜ける音）
    beep(880 + power * 520, 0.08, 'square', 0.05 + power * 0.07);
  }

  // 開始の合図「ピー！」
  function sndWhistle() {
    var a = audio();
    if (!a) return;
    var t = a.currentTime, dur = 0.55;
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.03);
    g.gain.setValueAtTime(0.2, t + dur - 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(a.destination);

    [2050, 2560].forEach(function (f, i) {
      var o = a.createOscillator();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.setValueAtTime(f * 0.94, t);
      o.frequency.linearRampToValueAtTime(f, t + 0.07);
      var lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = 26;                  // 笛のころころした震え
      lg.gain.value = f * 0.022;
      lfo.connect(lg); lg.connect(o.frequency);
      var og = a.createGain();
      og.gain.value = i === 0 ? 0.85 : 0.3;
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + dur + 0.02);
      lfo.start(t); lfo.stop(t + dur + 0.02);
    });

    // 息のノイズをすこし混ぜる
    var len = Math.floor(a.sampleRate * dur);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    var src = a.createBufferSource();
    src.buffer = buf;
    var bp = a.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 2.5;
    var ng = a.createGain(); ng.gain.value = 0.1;
    src.connect(bp); bp.connect(ng); ng.connect(g);
    src.start(t); src.stop(t + dur);
  }
  function sndTick()      { beep(880, 0.05, 'sine', 0.07); }

  // ---------------------------------------------------------------- 入力
  function pointerPos(e) {
    var r = cvs.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function dist2(ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  }

  function hitRect(p, r) {
    return Math.abs(p.x - r.x) < r.w * 0.5 + W * 0.025 &&
           Math.abs(p.y - r.y) < r.h * 0.5 + H * 0.02;
  }

  // じゃんけんボタンの位置。上のプレイヤーからも同じ並びに見えるよう左右を反転する
  function jkButtonPos(side, i) {
    var r = Math.min(IMG.w * 0.115, IMG.h * 0.062);
    var lx = (i - 1) * r * 2.75;
    return {
      x: F.cx + (side === 0 ? lx : -lx),
      y: side === 0 ? F.y + F.h * 0.75 : F.y + F.h * 0.25,
      r: r
    };
  }

  function startBtnRect() {
    var img = imgs.start;
    var ar = img ? img.height / img.width : 0.25;
    var w = TIMG.w * 0.80, h = w * ar;
    var maxH = TIMG.h * 0.13;
    if (h > maxH) { h = maxH; w = h / ar; }
    return { x: TIMG.x + TIMG.w / 2, y: TIMG.y + TIMG.h * 0.5, w: w, h: h };
  }

  function modeBtnRect(i) {          // 0 = ひとり(左) / 1 = ふたり(右)
    var img = i === 0 ? imgs.solo : imgs.duo;
    var ar = img ? img.height / img.width : 0.58;
    var w = TIMG.w * 0.475, h = w * ar;
    var maxH = TIMG.h * 0.19;
    if (h > maxH) { h = maxH; w = h / ar; }
    return { x: TIMG.x + TIMG.w * (i === 0 ? 0.262 : 0.738),
             y: TIMG.y + TIMG.h * 0.5, w: w, h: h };
  }

  // ステージ選択：上にロゴ、その下に2列×2段でステージを並べる
  function stageBtnRect(i) {
    var gapX = TIMG.w * 0.05, gapY = TIMG.h * 0.022;
    var w = (TIMG.w * 0.86 - gapX) / 2;
    var h = w / 0.60;                                  // 盤面の縦横比
    var maxH = (TIMG.h * 0.60 - gapY) / 2;
    if (h > maxH) { h = maxH; w = h * 0.60; }
    var col = i % 2, row = (i / 2) | 0;
    var cx0 = TIMG.x + TIMG.w / 2 + (col === 0 ? -(w + gapX) / 2 : (w + gapX) / 2);
    var top = TIMG.y + TIMG.h * 0.34;
    return { x: cx0, y: top + h / 2 + row * (h + gapY), w: w, h: h };
  }

  // メニュー画面の「もどる」
  function backBtnRect() {
    var r = Math.min(W, H) * 0.048;
    return { x: Math.max(TIMG.x, 0) + r * 1.8, y: Math.max(TIMG.y, 0) + r * 2.0, r: r };
  }

  function onDown(e) {
    audio();
    var p = pointerPos(e);
    if (mode === 'title' || mode === 'select') titleBgm();

    if (mode === 'title') {
      if (pressIdx >= 0) return;
      var rs = startBtnRect();
      if (hitRect(p, rs)) { pressIdx = 0; pressT = 0; burst(rs.x, rs.y, 30, W * 1.6); sndStart(); }
      else { burst(p.x, p.y, 5, W * 0.55); sndTick(); }
      return;
    }

    if (mode === 'select' || mode === 'stage') {
      var bb = backBtnRect();
      if (pressIdx < 0 && dist2(p.x, p.y, bb.x, bb.y) < bb.r * bb.r * 2.2) {
        burst(bb.x, bb.y, 10, W * 0.7); sndTick();
        mode = (mode === 'stage') ? 'select' : 'title';
        return;
      }
    }

    if (mode === 'select') {
      if (pressIdx >= 0) return;
      for (var b = 0; b < 2; b++) {
        var rb = modeBtnRect(b);
        if (hitRect(p, rb)) { pressIdx = b; pressT = 0; burst(rb.x, rb.y, 30, W * 1.5); sndStart(); return; }
      }
      burst(p.x, p.y, 5, W * 0.55); sndTick();
      return;
    }

    if (mode === 'stage') {
      if (pressIdx >= 0) return;
      for (var g = 0; g < STAGES.length; g++) {
        var rg = stageBtnRect(g);
        if (hitRect(p, rg)) { pressIdx = g; pressT = 0; burst(rg.x, rg.y, 30, W * 1.5); sndStart(); return; }
      }
      burst(p.x, p.y, 5, W * 0.55); sndTick();
      return;
    }

    // 勝ったときはお祝いを少し見せてからタップを受け付ける
    if (mode === 'win') { if (modeTimer > 1.6) newGame(); return; }

    // リセットボタン（長押しで発動）
    if (dist2(p.x, p.y, resetBtn.x, resetBtn.y) < resetBtn.r * resetBtn.r * 4) {
      resetPid = e.pointerId; resetHold = 0;
      return;
    }
    // タイトルへ戻るボタン（長押しで発動）
    if (dist2(p.x, p.y, homeBtn.x, homeBtn.y) < homeBtn.r * homeBtn.r * 4) {
      homePid = e.pointerId; homeHold = 0;
      return;
    }

    if (mode === 'janken') {
      if (jkPhase !== 'pick') return;
      var jside = p.y < F.cy ? 1 : 0;
      if (players === 1 && jside === 1) return;   // 上はコンピューター
      if (jkChoice[jside] !== null) return;       // 一度選んだら変えられない
      for (var i = 0; i < 3; i++) {
        var jb = jkButtonPos(jside, i);
        if (dist2(p.x, p.y, jb.x, jb.y) < jb.r * jb.r * 1.35) {
          jkChoice[jside] = i;
          beep(720, 0.09, 'square', 0.13);
          if (jkChoice[0] !== null && jkChoice[1] !== null) resolveJanken();
          break;
        }
      }
      return;
    }

    showHint = false;
    var side = p.y < F.cy ? 1 : 0;
    if (players === 1 && side === 1) return;      // 上はコンピューターが動かす
    var m = mallets[side];
    if (m.pid === null) {                 // その側の最初の指だけを受け付ける
      m.pid = e.pointerId;
      m.tx = p.x; m.ty = p.y;
      clampTarget(m);
    }
  }

  function onMove(e) {
    var p = null;
    if (resetPid === e.pointerId) {
      p = pointerPos(e);
      // 指がボタンから離れたら長押しを取り消す
      if (dist2(p.x, p.y, resetBtn.x, resetBtn.y) > resetBtn.r * resetBtn.r * 9) {
        resetPid = null; resetHold = 0;
      }
      return;
    }
    if (homePid === e.pointerId) {
      p = pointerPos(e);
      if (dist2(p.x, p.y, homeBtn.x, homeBtn.y) > homeBtn.r * homeBtn.r * 9) {
        homePid = null; homeHold = 0;
      }
      return;
    }
    for (var i = 0; i < 2; i++) {
      var m = mallets[i];
      if (m.pid === e.pointerId) {
        p = pointerPos(e);
        m.tx = p.x; m.ty = p.y;
        clampTarget(m);
      }
    }
  }

  function onUp(e) {
    if (resetPid === e.pointerId) { resetPid = null; resetHold = 0; }
    if (homePid === e.pointerId) { homePid = null; homeHold = 0; }
    for (var i = 0; i < 2; i++) {
      if (mallets[i].pid === e.pointerId) mallets[i].pid = null;
    }
  }

  function clampTarget(m) {
    m.tx = clamp(m.tx, F.x + m.r, F.x + F.w - m.r);
    if (m.side === 0) m.ty = clamp(m.ty, F.cy + m.r * 0.1, F.y + F.h - m.r);
    else              m.ty = clamp(m.ty, F.y + m.r, F.cy - m.r * 0.1);
  }

  cvs.addEventListener('pointerdown',   onDown, { passive:true });
  cvs.addEventListener('pointermove',   onMove, { passive:true });
  cvs.addEventListener('pointerup',     onUp,   { passive:true });
  cvs.addEventListener('pointercancel', onUp,   { passive:true });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu',  function (e) { e.preventDefault(); });
  document.addEventListener('dblclick',     function (e) { e.preventDefault(); });

  // ---------------------------------------------------------------- 進行
  function newGame() {
    score[0] = score[1] = 0;
    flash = 0; shake = 0;
    battleBgm();
    placeAll();
    startJanken();          // 先行後攻はじゃんけんで決める
  }

  function goTitle() {
    mode = 'title'; modeTimer = 0;
    pressIdx = -1; pressT = 0;
    resetPid = null; resetHold = 0;
    homePid = null; homeHold = 0;
    mallets[0].pid = mallets[1].pid = null;
    showHint = true;
    titleBgm();
  }

  function startJanken() {
    jkPhase = 'pick';
    jkChoice = [null, null];
    jkWinner = -1;
    ai.jkT = 0;
    mode = 'janken'; modeTimer = 0;
  }

  function resolveJanken() {
    var a = jkChoice[0], b = jkChoice[1];
    jkWinner = (a === b) ? -1 : (JK_BEATS[a] === b ? 0 : 1);
    jkPhase = 'show'; modeTimer = 0;
    if (jkWinner < 0) beep(400, 0.16, 'triangle', 0.12);
    else [660, 880].forEach(function (f, i) { beep(f, 0.18, 'square', 0.15, i * 0.11); });
  }

  var GOAL_TIME = 1.6;       // ゴール演出の長さ（秒）

  function scoreGoal(side) {
    score[side]++;
    goalSide = side;
    serveSide = 1 - side;      // 入れられた方から再開する
    flash = 1; shake = 1;
    burst(F.cx, side === 0 ? F.y : F.y + F.h, 36, F.w * 1.9);   // ゴール口からはじける
    puck.vx = puck.vy = 0;
    if (score[side] >= WIN_SCORE) { mode = 'win'; modeTimer = 0; sndWin(); }
    else                          { mode = 'goal'; modeTimer = 0; sndGoal(); }
  }

  function startCount() {
    resetPuck();
    mode = 'count'; modeTimer = 0; lastCount = -1;
  }

  // 点を入れられた方へ、ゆっくりパックを転がす
  function serve() {
    var dir = serveSide === 0 ? 1 : -1;        // side 0 は下側
    puck.vx = (Math.random() - 0.5) * 0.12 * F.w;
    puck.vy = dir * 0.44 * F.w;
    mode = 'play'; modeTimer = 0;
    sndWhistle();
  }

  // ---------------------------------------------------------------- 粒
  var PART_COL = ['#ff4d6d', '#2f7dff', '#ffd23f', '#ff9f1c', '#ffffff', '#4ad4ff'];
  function burst(x, y, n, spread) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (0.25 + Math.random() * 0.75) * spread;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - spread * 0.3,
        life: 0.5 + Math.random() * 0.55, t: 0,
        r: W * (0.007 + Math.random() * 0.015),
        col: PART_COL[Math.floor(Math.random() * PART_COL.length)]
      });
    }
  }

  function updateParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += W * 1.4 * dt;
      p.vx *= Math.pow(0.5, dt);
    }
  }

  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var k = 1 - p.t / p.life;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.45 + k * 0.55), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------------- コンピューター
  function updateAI(dt) {
    var m = mallets[1];
    ai.think -= dt;
    if (ai.think <= 0) {
      ai.think = 0.30 + Math.random() * 0.40;
      ai.errX  = (Math.random() - 0.5) * F.w * 0.40;   // 狙いがずれる
      ai.rest  = Math.random() < 0.22 ? 0.35 + Math.random() * 0.5 : 0;
    }
    if (ai.rest > 0) { ai.rest -= dt; return; }        // ときどきぼーっとする

    var home = F.y + F.h * 0.15;

    // 隅のパックは押し出せないので、追いかけずに待つ（挟み込み防止）
    var margin = m.r * 1.5;
    if (puck.y < F.y + margin * 1.5 &&
        (puck.x < F.x + margin || puck.x > F.x + F.w - margin)) {
      m.tx = F.cx + (puck.x - F.cx) * 0.45;
      m.ty = home;
      clampTarget(m);
      return;
    }

    // 壁ぎわで動けなくなっているときだけ、押し続けずに一度離れる。
    // 盤の真ん中で止まっているときは、ちゃんと取りに行く
    var edge = (m.r + puck.r) * 1.6;
    var atWall = puck.x < F.x + edge || puck.x > F.x + F.w - edge || puck.y < F.y + edge;
    if (idleTime > 0.6 && atWall) {
      m.tx = F.cx + (puck.x - F.cx) * 0.5;
      m.ty = home;
      clampTarget(m);
      return;
    }

    if (mode === 'play' && puck.y < F.cy) {
      // パックの向こう側（相手ゴールの反対側）に回り込んで押し出す。
      // 真上から重ねると、壁ぎわでパックを挟み込んでしまうため
      var gx = F.cx, gy = F.y + F.h;                   // 相手のゴール
      var dx = puck.x - gx, dy = puck.y - gy;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var back = m.r + puck.r * 0.85;
      m.tx = puck.x + dx / d * back + ai.errX;
      m.ty = puck.y + dy / d * back;
    } else {
      m.tx = F.cx + (puck.x - F.cx) * 0.35 + ai.errX * 0.5;
      m.ty = home;                                     // ゴール前に戻る
    }
    clampTarget(m);
  }

  // ---------------------------------------------------------------- 物理
  var PUCK_MAX    = 2.25;   // パックの最高速度。小さいほどゆっくりでやさしい
  var REST        = 0.35;   // 止まっているマレットに当たったとき、どれだけ返るか
  var HIT_MIN     = 0.46;   // そっと当てたとき、マレットの速さの何倍でパックが動くか
  var HIT_MAX     = 1.70;   // 強く当てたとき
  var HIT_COOL    = 0.09;   // 同じマレットが続けて当たらない時間（秒）
  var SMASH_AT    = 0.50;   // これ以上の強さで当たったら、強打の音になる
  var WALL_BOUNCE = 0.93;

  // k = この刻みで、残りの距離のうちどれだけ進むか（最後の刻みで k=1 になる）
  function stepMallet(m, sdt, k) {
    var nx, ny;
    if (m.side === 1 && players === 1) {
      // コンピューターだけ速さの上限がある
      var maxV = AI_SPEED * F.w;
      var dx = m.tx - m.x, dy = m.ty - m.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var step = maxV * sdt;
      if (d <= step || d === 0) { nx = m.tx; ny = m.ty; }
      else { nx = m.x + dx / d * step; ny = m.y + dy / d * step; }
    } else {
      // 人のマレットは指の位置そのもの。1コマの中で細かく分けて動かし、
      // 途中にあるパックを飛び越さないようにする
      nx = m.x + (m.tx - m.x) * k;
      ny = m.y + (m.ty - m.y) * k;
    }
    m.vx = (nx - m.x) / sdt;
    m.vy = (ny - m.y) / sdt;
    m.x = nx; m.y = ny;
  }

  function stepPuck(sdt) {
    puck.x += puck.vx * sdt;
    puck.y += puck.vy * sdt;

    var gh = goalHalfWidth();
    var inGoalX = Math.abs(puck.x - F.cx) < gh;
    var left = F.x, right = F.x + F.w, top = F.y, bottom = F.y + F.h;

    if (puck.x - puck.r < left)   { bump(Math.abs(puck.vx)); puck.x = left + puck.r;   puck.vx = Math.abs(puck.vx) * WALL_BOUNCE; }
    if (puck.x + puck.r > right)  { bump(Math.abs(puck.vx)); puck.x = right - puck.r;  puck.vx = -Math.abs(puck.vx) * WALL_BOUNCE; }

    // 上のゴール（入ると下のプレイヤーの得点）
    if (puck.y - puck.r < top) {
      if (inGoalX) {
        if (puck.y < top - puck.r * 0.4) { scoreGoal(0); return true; }
      } else {
        bump(Math.abs(puck.vy)); puck.y = top + puck.r; puck.vy = Math.abs(puck.vy) * WALL_BOUNCE;
      }
    }
    // 下のゴール（入ると上のプレイヤーの得点）
    if (puck.y + puck.r > bottom) {
      if (inGoalX) {
        if (puck.y > bottom + puck.r * 0.4) { scoreGoal(1); return true; }
      } else {
        bump(Math.abs(puck.vy)); puck.y = bottom - puck.r; puck.vy = -Math.abs(puck.vy) * WALL_BOUNCE;
      }
    }
    return false;
  }

  var wallCool = 0;
  function bump(v) {
    if (wallCool > 0) return;
    if (v < 0.13 * F.w) return;          // かすっただけなら鳴らさない
    sndWall(Math.min(1, v / (PUCK_MAX * F.w)));
    wallCool = 0.13;
  }

  function collide(m) {
    var dx = puck.x - m.x, dy = puck.y - m.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var min = puck.r + m.r;
    if (d >= min) return;
    if (d < 0.0001) { dx = 0; dy = m.side === 0 ? -1 : 1; d = 1; }
    var nx = dx / d, ny = dy / d;

    puck.x = m.x + nx * min;
    puck.y = m.y + ny * min;

    var sep = 0.02 * F.w;      // ぴったりくっついて離れなくならないように

    // 一度当てた直後は、続けて弾かない（速く振ると1コマの中で何度も当たり、
    // へんな向きに飛んでしまうため）
    var mvx = m.svx, mvy = m.svy;      // ならした速さ

    if (m.hitCool > 0) {
      var rc = (puck.vx - mvx) * nx + (puck.vy - mvy) * ny;
      if (rc < sep) { puck.vx += nx * (sep - rc); puck.vy += ny * (sep - rc); }
      return;
    }

    // (1) パック自身の勢いは、決まった割合だけ返す（止まっているマレットの手ごたえ）
    var pvn = puck.vx * nx + puck.vy * ny;
    if (pvn < 0) {
      var j = -(1 + REST) * pvn;
      puck.vx += nx * j;
      puck.vy += ny * j;
    }
    // (2) マレットが押し込んだ勢いを、当てた強さに応じて足す
    var ms = mvx * nx + mvy * ny;
    if (ms > 0) {
      var k = HIT_MIN + (HIT_MAX - HIT_MIN) * Math.min(1, ms / F.w);
      puck.vx += nx * ms * k;
      puck.vy += ny * ms * k;
    }
    // まだマレットに向かっていたら、離れるぶんだけ直す
    var rel = (puck.vx - mvx) * nx + (puck.vy - mvy) * ny;
    if (rel < sep) { puck.vx += nx * (sep - rel); puck.vy += ny * (sep - rel); }
    m.hitCool = HIT_COOL;

    // 壁とマレットに挟まれて震え続けないよう、押しつぶされたら中央へ逃がす
    var bx = puck.x, by = puck.y;
    var gh2 = goalHalfWidth();
    puck.x = clamp(puck.x, F.x + puck.r, F.x + F.w - puck.r);
    if (Math.abs(puck.x - F.cx) >= gh2) {
      puck.y = clamp(puck.y, F.y + puck.r, F.y + F.h - puck.r);
    }
    if (dist2(bx, by, puck.x, puck.y) > (puck.r * 0.12) * (puck.r * 0.12)) {
      var dcx = F.cx - puck.x, dcy = F.cy - puck.y;
      var dl = Math.sqrt(dcx * dcx + dcy * dcy) || 1;
      var esc = 0.5 * F.w;
      puck.vx = dcx / dl * esc;
      puck.vy = dcy / dl * esc;
    }

    // くっついて止まらない程度に、ごく弱い下限だけ設ける
    var sp = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
    var minSp = 0.09 * F.w;
    if (sp < minSp) {
      if (sp < 1) { puck.vx = nx * minSp; puck.vy = ny * minSp; }
      else        { puck.vx = puck.vx / sp * minSp; puck.vy = puck.vy / sp * minSp; }
      sp = minSp;
    }
    var power = Math.min(1, sp / (PUCK_MAX * F.w));
    if (power >= SMASH_AT) sndSmash(power);      // 強打は専用の音
    else                   sndHit(power);
    buzz(power);
  }

  // 打った手ごたえ（対応している端末だけ震える）
  function buzz(power) {
    if (!navigator.vibrate || power < 0.06) return;   // そっと当てたときは震えない
    try {
      if (power >= SMASH_AT) navigator.vibrate([30, 35, Math.round(35 + power * 45)]);
      else navigator.vibrate(Math.round(8 + power * 42));
    } catch (e) {}
  }

  function clampPuckSpeed() {
    var sp = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
    var max = PUCK_MAX * F.w;
    if (sp > max) { puck.vx = puck.vx / sp * max; puck.vy = puck.vy / sp * max; }
  }

  function update(dt) {
    updateParts(dt);
    wallCool -= dt;
    if (flash > 0) flash = Math.max(0, flash - dt * 2.6);
    if (shake > 0) shake = Math.max(0, shake - dt * 3.0);

    // タイトル・モード選択
    if (mode === 'title' || mode === 'select' || mode === 'stage') {
      if (pressIdx >= 0) {
        pressT += dt;
        if (pressT > 0.5) {
          var idx = pressIdx;
          pressIdx = -1; pressT = 0;
          if (mode === 'title') mode = 'select';
          else if (mode === 'select') { players = (idx === 0) ? 1 : 2; mode = 'stage'; }
          else { stageIdx = idx; FLD = STAGES[idx].fld; layout(); newGame(); }
        }
      }
      return;
    }

    if (resetPid !== null) {
      resetHold += dt;
      if (resetHold >= RESET_HOLD) {
        resetPid = null; resetHold = 0;
        beep(880, 0.14, 'square', 0.14);
        newGame();
      }
    }
    if (homePid !== null) {
      homeHold += dt;
      if (homeHold >= RESET_HOLD) {
        homePid = null; homeHold = 0;
        beep(660, 0.16, 'square', 0.14);
        goTitle();
      }
    }

    if (mode === 'goal') {
      modeTimer += dt;
      if (modeTimer > GOAL_TIME) startCount();
    } else if (mode === 'count') {
      modeTimer += dt;
      var n = 3 - Math.floor(modeTimer / CD_STEP);   // 3 → 2 → 1
      if (n !== lastCount && n >= 1) { lastCount = n; beep(620, 0.12, 'square', 0.14); }
      if (modeTimer >= CD_STEP * 3) serve();
    } else if (mode === 'janken') {
      modeTimer += dt;
      if (jkPhase === 'pick') {
        if (players === 1 && jkChoice[1] === null && jkChoice[0] !== null) {
          ai.jkT += dt;                               // コンピューターは少し遅れて出す
          if (ai.jkT > 0.6) { jkChoice[1] = Math.floor(Math.random() * 3); resolveJanken(); }
        } else if (players === 2 && modeTimer > JK_WAIT &&
                   (jkChoice[0] === null) !== (jkChoice[1] === null)) {
          // 片方しか選ばないまま止まらないよう、待ちすぎたら自動で決める
          var s = jkChoice[0] === null ? 0 : 1;
          jkChoice[s] = Math.floor(Math.random() * 3);
          resolveJanken();
        }
      } else if (modeTimer > (jkWinner < 0 ? 1.4 : 1.9)) {
        if (jkWinner < 0) { jkChoice = [null, null]; jkPhase = 'pick'; ai.jkT = 0; modeTimer = 0; }
        else { serveSide = jkWinner; startCount(); }
      }
    } else if (mode === 'win') {
      modeTimer += dt;
    }

    if (players === 1 && (mode === 'play' || mode === 'count' || mode === 'goal')) updateAI(dt);

    for (var mi = 0; mi < 2; mi++) {
      var mm = mallets[mi];
      mm.hitCool = Math.max(0, mm.hitCool - dt);
      // 指の位置へ一気に追いつくぶん、瞬間の速さは実際より大きく出る。
      // 1コマぶんの移動をならして、見た目どおりの速さにする
      var a = Math.min(1, dt / 0.05);
      mm.svx += ((mm.x - mm.lx) / dt - mm.svx) * a;
      mm.svy += ((mm.y - mm.ly) / dt - mm.svy) * a;
      mm.lx = mm.x; mm.ly = mm.y;
    }

    var frozen = (mode !== 'play') || isLandscape();

    // 動く量に合わせて刻みの数を決める（速く指を動かしても飛び越さない）
    var need = Math.max(Math.abs(puck.vx * dt), Math.abs(puck.vy * dt));
    for (var mi3 = 0; mi3 < 2; mi3++) {
      var m3 = mallets[mi3];
      need = Math.max(need, Math.abs(m3.tx - m3.x), Math.abs(m3.ty - m3.y));
    }
    var N = Math.min(24, Math.max(8, Math.ceil(need / Math.max(1, puck.r * 0.8))));
    var sdt = dt / N;

    for (var s2 = 0; s2 < N; s2++) {
      var kk = 1 / (N - s2);
      stepMallet(mallets[0], sdt, kk);
      stepMallet(mallets[1], sdt, kk);
      if (frozen) continue;
      if (stepPuck(sdt)) break;
      collide(mallets[0]);
      collide(mallets[1]);
      clampPuckSpeed();
    }

    if (!frozen) {
      var f = Math.pow(0.88, dt);
      puck.vx *= f; puck.vy *= f;
      var sp = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
      if (sp < 0.012 * F.w) { puck.vx = puck.vy = 0; }

      // 隅は構造上マレットで押し出せないので、止まりかけたら中央へそっと転がす
      var edge = puck.r * 2.2;
      var nearWall = puck.x < F.x + edge || puck.x > F.x + F.w - edge ||
                     puck.y < F.y + edge || puck.y > F.y + F.h - edge;
      if (nearWall && (sp < 0.10 * F.w || idleTime > 0.25)) {
        var ax = F.cx - puck.x, ay = F.cy - puck.y;
        var al = Math.sqrt(ax * ax + ay * ay) || 1;
        puck.vx += ax / al * 0.7 * F.w * dt;
        puck.vy += ay / al * 0.7 * F.w * dt;
      }

      // 隅で動けなくなっていないか、位置の変化で見る
      // （壁とマレットの間で細かく震えている状態も拾えるようにするため）
      stuckT += dt;
      if (stuckT > 0.5) {
        var moved = puck.r * 0.9;      // ほぼその場から動いていないときだけ数える
        if (dist2(puck.x, puck.y, stuckX, stuckY) < moved * moved) idleTime += stuckT;
        else idleTime = 0;
        stuckX = puck.x; stuckY = puck.y; stuckT = 0;
      }
      if (idleTime > 3) { resetPuck(); idleTime = 0; }

      trail.push({ x: puck.x, y: puck.y });
      if (trail.length > 7) trail.shift();
    }
  }

  // ---------------------------------------------------------------- 描画
  // 画面と絵の形が違うとき、まわりを絵のぼかしでうめる
  var bdCache = {};
  function drawBackdrop(img, key) {
    var c = bdCache[key];
    if (!c || c.w !== W || c.h !== H) {
      var sw = Math.max(8, Math.round(W / 12)), sh = Math.max(8, Math.round(H / 12));
      var cv = document.createElement('canvas');
      cv.width = sw; cv.height = sh;
      var cx = cv.getContext('2d');
      var s = Math.max(sw / img.width, sh / img.height);
      cx.drawImage(img, (sw - img.width * s) / 2, (sh - img.height * s) / 2,
                   img.width * s, img.height * s);
      c = bdCache[key] = { cv: cv, w: W, h: H };
    }
    ctx.drawImage(c.cv, 0, 0, W, H);
    ctx.fillStyle = 'rgba(6,16,42,0.5)';
    ctx.fillRect(0, 0, W, H);
  }

  function drawCover(img) {
    var s = Math.max(W / img.width, H / img.height);
    var w = img.width * s, h = img.height * s;
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  }

  function drawFitted(img, key, rect, side) {
    ctx.fillStyle = '#0b1b3a';
    ctx.fillRect(0, 0, W, H);
    if (rect.w < W - 1 || rect.h < H - 1) {
      if (side && imgs.side) drawCover(imgs.side);   // 飾りの絵で余白をうめる
      else drawBackdrop(img, key);
    }
    ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h);
  }

  function drawField() {
    var fi = imgs['stage' + stageIdx];
    if (fi) { drawFitted(fi, 'field' + stageIdx, IMG, true); return; }
    ctx.fillStyle = '#0b1b3a'; ctx.fillRect(0, 0, W, H);
    // 画像が読めていないあいだの代わり
    ctx.fillStyle = '#eaf4ff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,90,120,0.14)'; ctx.fillRect(F.x, F.y, F.w, F.h / 2);
    ctx.fillStyle = 'rgba(70,140,255,0.14)'; ctx.fillRect(F.x, F.cy, F.w, F.h / 2);
    ctx.strokeStyle = 'rgba(20,60,120,0.25)';
    ctx.lineWidth = Math.max(3, W * 0.01);
    ctx.strokeRect(F.x, F.y, F.w, F.h);
    ctx.beginPath(); ctx.moveTo(F.x, F.cy); ctx.lineTo(F.x + F.w, F.cy); ctx.stroke();
  }

  function drawScore() {
    var r = Math.min(IMG.w, IMG.h) * 0.019;
    var gap = r * 2.9;
    var total = (WIN_SCORE - 1) * gap;
    var off = FLD.circle * IMG.h + r * 2.6;      // センターサークルの外側に置く

    for (var side = 0; side < 2; side++) {
      var y = side === 0 ? F.cy + off : F.cy - off;
      var col = side === 0 ? COL.p1 : COL.p2;
      for (var i = 0; i < WIN_SCORE; i++) {
        var x = F.cx - total / 2 + i * gap;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
        if (i < score[side]) {
          ctx.fillStyle = col; ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.lineWidth = Math.max(1.5, r * 0.22); ctx.stroke();
        } else {
          ctx.strokeStyle = 'rgba(30,70,130,0.3)';
          ctx.lineWidth = Math.max(2, r * 0.32);
          ctx.stroke();
        }
      }
    }
  }

  function drawMallet(m) {
    var img = m.side === 0 ? imgs.malletB : imgs.malletR;
    if (img) {
      var d = m.r * 2.12;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = m.r * 0.45;
      ctx.shadowOffsetY = m.r * 0.18;
      ctx.drawImage(img, m.x - d / 2, m.y - d / 2, d, d);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = m.r * 0.5;
    ctx.shadowOffsetY = m.r * 0.16;
    ctx.fillStyle = m.dark;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill();
    ctx.restore();

    ctx.fillStyle = m.col;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.9, 0, 7); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.42, 0, 7); ctx.fill();
    ctx.fillStyle = m.col;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.28, 0, 7); ctx.fill();
  }

  function drawPuck() {
    var img = imgs.puck;
    for (var i = 0; i < trail.length; i++) {
      var t = trail[i];
      ctx.globalAlpha = (i + 1) / trail.length * (img ? 0.14 : 0.22);
      ctx.fillStyle = img ? '#1a1a20' : COL.puck;
      ctx.beginPath(); ctx.arc(t.x, t.y, puck.r * 0.85, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (img) {
      var d = puck.r * 2.15;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = puck.r * 0.5;
      ctx.shadowOffsetY = puck.r * 0.22;
      ctx.drawImage(img, puck.x - d / 2, puck.y - d / 2, d, d);
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = puck.r * 0.6;
    ctx.shadowOffsetY = puck.r * 0.2;
    ctx.fillStyle = COL.puckDark;
    ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r, 0, 7); ctx.fill();
    ctx.restore();

    ctx.fillStyle = COL.puck;
    ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r * 0.82, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(puck.x - puck.r * 0.28, puck.y - puck.r * 0.3, puck.r * 0.24, 0, 7); ctx.fill();
  }

  function drawResetBtn() {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(resetBtn.x, resetBtn.y, resetBtn.r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#1b4ea8';
    ctx.lineWidth = Math.max(2, resetBtn.r * 0.16);
    ctx.beginPath();
    ctx.arc(resetBtn.x, resetBtn.y, resetBtn.r * 0.52, 0.6, 5.4);
    ctx.stroke();
    var ax = resetBtn.x + resetBtn.r * 0.52 * Math.cos(5.4);
    var ay = resetBtn.y + resetBtn.r * 0.52 * Math.sin(5.4);
    ctx.beginPath();
    ctx.moveTo(ax - resetBtn.r * 0.2, ay - resetBtn.r * 0.05);
    ctx.lineTo(ax + resetBtn.r * 0.1, ay - resetBtn.r * 0.22);
    ctx.lineTo(ax + resetBtn.r * 0.14, ay + resetBtn.r * 0.16);
    ctx.closePath();
    ctx.fillStyle = '#1b4ea8'; ctx.fill();
    ctx.restore();

    if (resetPid !== null) {
      ctx.save();
      ctx.strokeStyle = '#1b4ea8';
      ctx.lineWidth = Math.max(3, resetBtn.r * 0.2);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(resetBtn.x, resetBtn.y, resetBtn.r * 0.86,
              -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (resetHold / RESET_HOLD));
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawHomeBtn() {
    var b = homeBtn, r = b.r;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.fill();
    // おうちの絵
    ctx.fillStyle = '#1b4ea8';
    ctx.beginPath();
    ctx.moveTo(b.x, b.y - r * 0.52);
    ctx.lineTo(b.x + r * 0.56, b.y - r * 0.02);
    ctx.lineTo(b.x - r * 0.56, b.y - r * 0.02);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(b.x - r * 0.34, b.y - r * 0.04, r * 0.68, r * 0.52);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(b.x - r * 0.12, b.y + r * 0.14, r * 0.24, r * 0.34);
    ctx.restore();

    if (homePid !== null) {
      ctx.save();
      ctx.strokeStyle = '#1b4ea8';
      ctx.lineWidth = Math.max(3, r * 0.2);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(b.x, b.y, r * 0.86, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (homeHold / RESET_HOLD));
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawHint(t) {
    var pulse = 0.72 + Math.sin(t * 3.4) * 0.28;
    var fs = Math.min(IMG.w * 0.075, IMG.h * 0.042);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + fs + SANS;
    ctx.lineWidth = fs * 0.22;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineJoin = 'round';

    ctx.strokeText('ゆびで うごかそう', F.cx, F.y + F.h * 0.93);
    ctx.fillStyle = COL.p1dark;
    ctx.fillText('ゆびで うごかそう', F.cx, F.y + F.h * 0.93);

    if (players === 2) {
      ctx.save();
      ctx.translate(F.cx, F.y + F.h * 0.07);
      ctx.rotate(Math.PI);
      ctx.strokeText('ゆびで うごかそう', 0, 0);
      ctx.fillStyle = COL.p2dark;
      ctx.fillText('ゆびで うごかそう', 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  // 2人が向かい合って見るので、上下それぞれの向きで表示する
  function easeOutBack(k) {
    var p = k - 1;
    return 1 + 2.70158 * p * p * p + 1.70158 * p * p;
  }

  // 勢いよく飛び出して、少し揺れてから消える
  function drawGoalImage(img) {
    var k = Math.min(1, modeTimer / 0.34);
    var scale = 0.3 + 0.7 * easeOutBack(k);
    var wob = Math.sin(modeTimer * 17) * 0.05 * Math.max(0, 1 - modeTimer * 2.4);
    var fade = 0.26;
    var alpha = modeTimer > GOAL_TIME - fade
      ? Math.max(0, (GOAL_TIME - modeTimer) / fade) : 1;

    var w = Math.min(IMG.w * 0.86, IMG.h * 0.46);
    var h = w * img.height / img.width;

    for (var side = 0; side < 2; side++) {
      ctx.save();
      ctx.globalAlpha = alpha;
      if (side === 0) ctx.translate(F.cx, F.y + F.h * 0.70);
      else { ctx.translate(F.cx, F.y + F.h * 0.30); ctx.rotate(Math.PI); }
      ctx.scale(scale, scale);
      ctx.rotate(wob);
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawGoalBanner() {
    if (imgs.goal) { drawGoalImage(imgs.goal); return; }

    var k = Math.min(1, modeTimer / 0.22);
    var scale = 0.6 + k * 0.4;
    var col = goalSide === 0 ? COL.p1 : COL.p2;
    var fs = Math.min(IMG.w * 0.17, IMG.h * 0.085);

    for (var side = 0; side < 2; side++) {
      ctx.save();
      if (side === 0) ctx.translate(F.cx, F.y + F.h * 0.70);
      else { ctx.translate(F.cx, F.y + F.h * 0.30); ctx.rotate(Math.PI); }
      ctx.scale(scale, scale);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 ' + fs + SANS;
      ctx.lineWidth = fs * 0.18;
      ctx.strokeStyle = '#ffffff';
      ctx.lineJoin = 'round';
      var msg = goalSide === side ? 'ゴール！' : 'はいった！';
      ctx.strokeText(msg, 0, 0);
      ctx.fillStyle = col;
      ctx.fillText(msg, 0, 0);
      ctx.restore();
    }
  }

  // じゃんけん画面
  function drawJanken(t) {
    ctx.fillStyle = 'rgba(10,25,55,0.58)';
    ctx.fillRect(0, 0, W, H);

    var r = jkButtonPos(0, 1).r;
    var titleFs = Math.min(IMG.w * 0.078, IMG.h * 0.044);
    var resFs   = Math.min(IMG.w * 0.115, IMG.h * 0.065);
    var subFs   = Math.min(IMG.w * 0.055, IMG.h * 0.031);

    for (var side = 0; side < 2; side++) {
      ctx.save();
      if (side === 0) ctx.translate(F.cx, F.y + F.h * 0.75);
      else { ctx.translate(F.cx, F.y + F.h * 0.25); ctx.rotate(Math.PI); }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (jkPhase === 'pick') {
        ctx.font = '900 ' + titleFs + SANS;
        ctx.fillStyle = '#ffffff';
        var head = jkChoice[side] === null
          ? (players === 1 && side === 1 ? 'コンピューター' : 'じゃんけん…')
          : 'えらんだ！';
        ctx.fillText(head, 0, -r * 2.1);

        if (jkChoice[side] === null) {
          if (players === 1 && side === 1) {
            ctx.font = (r * 1.4) + EMO;
            ctx.fillText('🤖', 0, 0);
          } else {
            for (var i = 0; i < 3; i++) {
              var lx = (i - 1) * r * 2.75;
              var pulse = 1 + Math.sin(t * 3 + i * 0.7) * 0.03;
              ctx.save();
              ctx.translate(lx, 0);
              ctx.scale(pulse, pulse);
              ctx.fillStyle = 'rgba(255,255,255,0.95)';
              ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
              var bi = imgs['jk' + i];
              if (bi) {
                var bd = r * 1.72;
                ctx.drawImage(bi, -bd / 2, -bd / 2, bd, bd);
              } else {
                ctx.font = (r * 1.15) + EMO;
                ctx.fillText(JK_EMOJI[i], 0, r * 0.04);
              }
              ctx.restore();
            }
          }
        } else {
          // 相手に見えないよう、選んだ手そのものは伏せる
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
          ctx.font = '900 ' + (r * 1.2) + SANS;
          ctx.fillStyle = side === 0 ? COL.p1 : COL.p2;
          ctx.fillText('✓', 0, r * 0.06);
        }
      } else {
        var pop = 1 + Math.max(0, 0.3 - modeTimer * 1.6);
        ctx.save();
        ctx.scale(pop, pop);
        var hi = imgs['jk' + jkChoice[side]];
        if (hi) {
          var hd = r * 2.7;
          ctx.drawImage(hi, -hd / 2, -r * 0.75 - hd / 2, hd, hd);
        } else {
          ctx.font = (r * 2.0) + EMO;
          ctx.fillText(JK_EMOJI[jkChoice[side]], 0, -r * 0.75);
        }
        ctx.restore();

        var won = (jkWinner === side);
        var msg = jkWinner < 0 ? 'あいこ！' : (won ? 'かち！' : 'まけ…');
        ctx.font = '900 ' + resFs + SANS;
        ctx.lineWidth = resFs * 0.18;
        ctx.strokeStyle = '#ffffff';
        ctx.lineJoin = 'round';
        ctx.strokeText(msg, 0, r * 1.3);
        ctx.fillStyle = jkWinner < 0 ? '#5b7bb5' : (won ? (side === 0 ? COL.p1 : COL.p2) : '#9fb2cf');
        ctx.fillText(msg, 0, r * 1.3);

        ctx.font = '700 ' + subFs + SANS;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillText(jkWinner < 0 ? 'もういちど' : (won ? 'パックが くるよ' : ''), 0, r * 1.3 + resFs * 0.95);
      }
      ctx.restore();
    }
  }

  // 3・2・1 のカウントと、パックが転がっていく向きの矢印
  function drawCountdown(t) {
    var n = 3 - Math.floor(modeTimer / CD_STEP);
    if (n < 1) n = 1;
    var k = (modeTimer % CD_STEP) / CD_STEP;
    var pop = 1 + Math.max(0, 0.45 - k * 1.7);
    var col = serveSide === 0 ? COL.p1 : COL.p2;
    var fs = Math.min(IMG.w * 0.24, IMG.h * 0.13);

    var dir = serveSide === 0 ? 1 : -1;
    var ax = F.cx, ay = F.cy + dir * (FLD.circle * IMG.h + puck.r * 1.6);
    var aw = puck.r * 1.1, ah = puck.r * 1.2;
    ctx.save();
    ctx.globalAlpha = 0.4 + Math.sin(t * 5) * 0.25;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(ax, ay + dir * ah);
    ctx.lineTo(ax - aw, ay);
    ctx.lineTo(ax + aw, ay);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    var img = imgs['num' + n];
    var ih = Math.min(IMG.h * 0.155, IMG.w * 0.30);
    var iw = img ? ih * img.width / img.height : 0;

    for (var side = 0; side < 2; side++) {
      ctx.save();
      if (side === 0) ctx.translate(F.cx, F.y + F.h * 0.685);
      else { ctx.translate(F.cx, F.y + F.h * 0.315); ctx.rotate(Math.PI); }
      ctx.scale(pop, pop);
      if (img) {
        ctx.drawImage(img, -iw / 2, -ih / 2, iw, ih);
      } else {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 ' + fs + SANS;
        ctx.lineWidth = fs * 0.14;
        ctx.strokeStyle = '#ffffff';
        ctx.lineJoin = 'round';
        ctx.strokeText(n, 0, 0);
        ctx.fillStyle = side === 0 ? COL.p1 : COL.p2;
        ctx.fillText(n, 0, 0);
      }
      ctx.restore();
    }
  }

  function drawWin(t) {
    ctx.fillStyle = 'rgba(10,25,55,0.55)';
    ctx.fillRect(0, 0, W, H);

    var col = goalSide === 0 ? COL.p1 : COL.p2;
    var bounce = Math.sin(t * 4) * (Math.min(IMG.w, IMG.h) * 0.02);
    var ef = Math.min(IMG.w * 0.22, IMG.h * 0.13);
    var fs = Math.min(IMG.w * 0.11, IMG.h * 0.062);
    var ss = Math.min(IMG.w * 0.058, IMG.h * 0.032);

    for (var side = 0; side < 2; side++) {
      var won = (goalSide === side);
      ctx.save();
      if (side === 0) ctx.translate(F.cx, F.y + F.h * 0.76);
      else { ctx.translate(F.cx, F.y + F.h * 0.24); ctx.rotate(Math.PI); }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = ef + EMO;
      ctx.fillText(won ? '🏆' : '👏', 0, -ef * 0.72 + (won ? bounce : 0));

      ctx.font = '900 ' + fs + SANS;
      ctx.lineWidth = fs * 0.18;
      ctx.strokeStyle = '#ffffff';
      ctx.lineJoin = 'round';
      var msg = won ? 'かち！' : 'まけ…';
      ctx.strokeText(msg, 0, ef * 0.16);
      ctx.fillStyle = won ? col : '#9fb2cf';
      ctx.fillText(msg, 0, ef * 0.16);

      ctx.font = '700 ' + ss + SANS;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(t * 3) * 0.3) + ')';
      ctx.fillText('タップで もういちど', 0, ef * 0.16 + fs * 1.15);
      ctx.restore();
    }
  }

  function drawRotateHint(t) {
    ctx.fillStyle = 'rgba(11,27,58,0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    var ef = Math.min(W * 0.12, H * 0.2);
    ctx.save();
    ctx.translate(W / 2, H * 0.40);
    ctx.rotate(Math.sin(t * 2) * 0.35 - 0.2);
    ctx.font = ef + EMO;
    ctx.fillText('📱', 0, 0);
    ctx.restore();

    var fs = Math.min(W * 0.055, H * 0.09);
    ctx.font = '900 ' + fs + SANS;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('たてむきに してね', W / 2, H * 0.72);
    ctx.restore();
  }

  // ---------------------------------------------------------------- タイトル
  function drawFloatBtn(img, rect, t, phase, pressed, label) {
    var bob = Math.sin(t * 1.8 + phase);
    var y = rect.y + bob * TIMG.h * 0.011;
    var sc = 1, alpha = 1;
    if (pressed) { sc = 1 + pressT * 1.9; alpha = Math.max(0, 1 - pressT / 0.42); }

    // 下の光（雲に浮いて見えるように）
    ctx.save();
    ctx.globalAlpha = alpha * (0.32 - bob * 0.07);
    var cw = rect.w * (0.5 - bob * 0.035);
    var gy = rect.y + rect.h * 0.6;
    var grd = ctx.createRadialGradient(rect.x, gy, 0, rect.x, gy, Math.max(1, cw));
    grd.addColorStop(0, 'rgba(255,255,255,0.95)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(rect.x, gy, cw, rect.h * 0.22, 0, 0, 7);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(rect.x, y);
    ctx.scale(sc, sc);
    ctx.rotate(bob * 0.014);
    if (img) {
      ctx.drawImage(img, -rect.w / 2, -rect.h / 2, rect.w, rect.h);
    } else {
      var fs = rect.h * 0.42;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.ellipse(0, 0, rect.w / 2, rect.h / 2, 0, 0, 7);
      ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '900 ' + fs + SANS;
      ctx.fillStyle = '#e5397a';
      ctx.fillText(label, 0, 0);
    }
    ctx.restore();
  }

  function drawTitleBg() {
    if (imgs.bg) { drawFitted(imgs.bg, 'title', TIMG); return; }
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#0b2a6b');
    grd.addColorStop(1, '#08町'.length ? '#0a1740' : '#0a1740');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + Math.min(W * 0.16, H * 0.09) + SANS;
    ctx.fillStyle = '#bfe3ff';
    ctx.fillText('ホッケー', W / 2, H * 0.28);
    ctx.fillStyle = '#ffb43f';
    ctx.fillText('バトル', W / 2, H * 0.40);
    ctx.restore();
  }

  function drawBackBtn(t) {
    var b = backBtnRect();
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#1b4ea8';
    ctx.beginPath();
    ctx.moveTo(b.x - b.r * 0.34, b.y);
    ctx.lineTo(b.x + b.r * 0.22, b.y - b.r * 0.42);
    ctx.lineTo(b.x + b.r * 0.22, b.y + b.r * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawVersion() {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    var fs = Math.max(9, Math.min(W * 0.032, H * 0.018));
    ctx.font = '600 ' + fs + SANS;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('v' + APP_VERSION, W * 0.035, H - Math.max(8, H * 0.018));
    ctx.restore();
  }

  function drawTitle(t) {
    drawTitleBg();
    drawFloatBtn(imgs.start, startBtnRect(), t, 0, pressIdx === 0, 'ゲームスタート');
    drawVersion();
  }

  function drawSelect(t) {
    drawTitleBg();
    ctx.fillStyle = 'rgba(6,18,48,0.42)';
    ctx.fillRect(0, 0, W, H);

    drawFloatBtn(imgs.solo, modeBtnRect(0), t, 0,   pressIdx === 0, 'ひとりで');
    drawFloatBtn(imgs.duo,  modeBtnRect(1), t, 1.2, pressIdx === 1, 'ふたりで');
    drawBackBtn(t);
  }

  function drawStage(t) {
    drawTitleBg();
    ctx.fillStyle = 'rgba(6,18,48,0.5)';
    ctx.fillRect(0, 0, W, H);

    // 見出し
    var ti = imgs.ttlStage;
    if (ti) {
      var tw = Math.min(TIMG.w * 0.72, TIMG.h * 0.42);
      var th = tw * ti.height / ti.width;
      var maxTh = TIMG.h * 0.20;
      if (th > maxTh) { th = maxTh; tw = th * ti.width / ti.height; }
      ctx.drawImage(ti, TIMG.x + TIMG.w / 2 - tw / 2, TIMG.y + TIMG.h * 0.15 - th / 2, tw, th);
    } else {
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var fs = Math.min(TIMG.w * 0.1, TIMG.h * 0.055);
      ctx.font = '900 ' + fs + SANS;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('ステージ せんたく', TIMG.x + TIMG.w / 2, TIMG.y + TIMG.h * 0.15);
      ctx.restore();
    }

    for (var i = 0; i < STAGES.length; i++) {
      var r = stageBtnRect(i);
      var img = imgs['stage' + i];
      var bob = Math.sin(t * 1.7 + i * 0.8);
      var y = r.y + bob * TIMG.h * 0.005;
      var sc = 1, alpha = 1;
      if (pressIdx === i) { sc = 1 + pressT * 1.6; alpha = Math.max(0, 1 - pressT / 0.42); }

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(r.x, y);
      ctx.scale(sc, sc);
      var rad = r.w * 0.12;
      ctx.save();
      roundRect(-r.w / 2, -r.h / 2, r.w, r.h, rad);
      ctx.clip();
      if (img) ctx.drawImage(img, -r.w / 2, -r.h / 2, r.w, r.h);
      else { ctx.fillStyle = '#9fb2cf'; ctx.fillRect(-r.w / 2, -r.h / 2, r.w, r.h); }
      ctx.restore();
      ctx.lineWidth = Math.max(3, r.w * 0.035);
      ctx.strokeStyle = '#ffffff';
      roundRect(-r.w / 2, -r.h / 2, r.w, r.h, rad);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    drawBackBtn(t);
    drawVersion();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render(t) {
    if (mode === 'title')  { drawTitle(t);  drawParts(); return; }
    if (mode === 'select') { drawSelect(t); drawParts(); return; }
    if (mode === 'stage')  { drawStage(t);  drawParts(); return; }

    ctx.save();
    if (shake > 0) {
      var a = shake * Math.min(IMG.w, IMG.h) * 0.012;
      ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a);
    }

    drawField();
    drawScore();
    if (mode !== 'janken') {          // じゃんけん中は盤上を空にしておく
      if (mode !== 'goal' || modeTimer < 0.85) drawPuck();
      drawMallet(mallets[0]);
      drawMallet(mallets[1]);
    }
    drawResetBtn();   // マレットに隠れないよう最後に描く
    drawHomeBtn();

    if (showHint && mode === 'play') drawHint(t);
    if (mode === 'goal') drawGoalBanner();
    if (mode === 'count') drawCountdown(t);

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.28) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (mode === 'win') drawWin(t);
    if (mode === 'janken') drawJanken(t);
    drawParts();
    if (isLandscape()) drawRotateHint(t);
  }

  // ---------------------------------------------------------------- ループ
  var last = 0;
  function frame(now) {
    var t = now / 1000;
    var dt = last ? Math.min(0.05, t - last) : 0.016;
    last = t;
    update(dt);
    render(t);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  resize();
  titleBgm();         // 自動再生が許されていれば、タイトルから音楽が鳴る
  requestAnimationFrame(frame);

  // ---------------------------------------------------------------- 自動更新
  if ('serviceWorker' in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      // 新しい中身が用意できたら、その場で読み直す
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        reg.update();
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) reg.update();      // アプリに戻るたびに確認
        });
        setInterval(function () { reg.update(); }, 60000);
      }).catch(function () {});
    });
  }
})();
</script>
